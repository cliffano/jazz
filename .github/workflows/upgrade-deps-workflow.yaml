---
name: Upgrade Dependencies
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.STUDIO_GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: git config --global user.email "pakkunbot@users.noreply.github.com"
      - run: git config --global user.name "pakkunbot"
      - run: npm install -g bob@5.3.0
      - run: bob updep build
      - run: git commit -am "Upgrade dependencies to latest"
      - uses: ad-m/github-push-action@v1.3.0
        with:
          tags: true
          github_token: ${{ secrets.STUDIO_GITHUB_TOKEN }}
          branch: ${{ github.ref }}
